aid: fundamental-research-labs
name: Fundamental Research Labs
description: 'Fundamental Research Labs (formerly Altera) is an applied AI research
  company building autonomous, collaborative AI agents, founded by researchers from
  MIT EECS, the Stanford NLP Group, Google X, and Citadel and backed by Andreessen
  Horowitz and Prosus. Its flagship product, Shortcut, is an AI analyst for Excel
  that turns natural-language prompts into full spreadsheet models — LBOs, DCFs,
  three-statement models, waterfalls — and ships a web app, desktop app, Excel and
  Google Sheets plugins, a ShortcutXL terminal agent (CLI), and a Platform API. The
  Shortcut Platform API lets teams submit spreadsheet-automation jobs, poll status,
  download generated workbooks, upload context files, list agent skills, and export
  organization usage data programmatically using API-key bearer authentication.'
