  /api/spreadsheets/skills/{skillId}/export:
    get:
      summary: Export a portable skill
      tags:
      - Spreadsheets
      description: Export your personal skill or a directly authorized team skill with full content visibility. Official and summary-only skills return 403. Returns {bundle, warnings}; import the bundle object or decode its base64 files into a directory. Only supported portable frontmatter survives; warnings describe removed metadata and declared platform dependencies. Storage provenance, ownership and history are excluded. Same decoded limits as import. No guarantee of execution compatibility with other agents.
      parameters:
      - schema:
          type: string
        in: path
        name: skillId
        required: true
      security:
      - apiKey: []
      - shortcutSession: []
      - shortcutCookie: []
      - shortcutOAuth: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  bundle:
                    type: object
                    properties:
                      format:
                        type: string
                        enum:
                        - shortcut-skill-v1
                      files:
                        type: array
                        items:
                          type: object
                          properties:
                            path:
                              type: string
                              minLength: 1
                              maxLength: 240
                            data:
                              type: string
                              maxLength: 1398104
                              description: Canonical padded base64 file bytes
                          required:
                          - path
                          - data
                          additionalProperties: false
                        minItems: 1
                        maxItems: 100
                    required:
                    - format
                    - files
                    additionalProperties: false
                  warnings:
                    type: array
                    items:
                      type: string
                required:
                - bundle
                - warnings
                additionalProperties: false
        '400':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
