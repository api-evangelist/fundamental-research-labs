                - error
                - message
                additionalProperties: false
      operationId: getApiSpreadsheetsSkills
      x-operation-id-source: derived
  /api/spreadsheets/skills/import:
    post:
      summary: Import a portable skill
      tags:
      - Spreadsheets
      description: 'Create a new personal skill from a shortcut-skill-v1 bundle. Never overwrites: duplicate names receive fresh personal:imported-{uuid} IDs. Only name, description, license and compatibility string frontmatter is supported. Maximum 100 files, 1 MiB per file, 5 MiB decoded total and 8 MiB request body. Requires root UTF-8 SKILL.md. No archive extraction, symlinks, hidden paths, team writes or official writes. External tools, credentials and platform dependencies are not installed.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                format:
                  type: string
                  enum:
                  - shortcut-skill-v1
                files:
                  type: array
                  items:
                    type: object
                    properties:
                      path:
                        type: string
                        minLength: 1
                        maxLength: 240
                      data:
                        type: string
                        maxLength: 1398104
                        description: Canonical padded base64 file bytes
                    required:
                    - path
                    - data
                    additionalProperties: false
                  minItems: 1
                  maxItems: 100
              required:
              - format
              - files
              additionalProperties: false
      security:
      - apiKey: []
      - shortcutSession: []
      - shortcutCookie: []
      - shortcutOAuth: []
      responses:
