      summary: Download Artifact
      tags:
      - Spreadsheets
      description: Download a specific artifact file produced by a job.
      parameters:
      - schema:
          type: string
        in: path
        name: runId
        required: true
        description: Unique run identifier
      - schema:
          type: string
        in: path
        name: filename
        required: true
        description: Artifact filename
      security:
      - apiKey: []
      - shortcutSession: []
      - shortcutCookie: []
      responses:
