                additionalProperties: false
  /api/spreadsheets/{runId}/cancel:
    post:
      summary: Cancel Spreadsheet Job
      tags:
      - Spreadsheets
      description: Cancel an active spreadsheet processing job. Active queued/running runs are marked cancelled and any live execution sandbox is terminated best-effort.
      parameters:
      - schema:
          type: string
        in: path
        name: runId
        required: true
        description: Unique run identifier
      security:
      - apiKey: []
      - shortcutSession: []
      - shortcutCookie: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  runId:
                    type: string
                  status:
                    type: string
                    enum:
                    - cancelled
                  previousStatus:
                    type: string
                    enum:
                    - queued
                    - running
                  message:
                    type: string
                required:
                - runId
                - status
                - previousStatus
                - message
                additionalProperties: false
        '401':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - false
                  error:
                    type: string
                  message:
                    type: string
                  status:
                    type: string
                required:
                - success
                - error
                - message
                additionalProperties: false
        '403':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - false
                  error:
                    type: string
                  message:
                    type: string
                  status:
                    type: string
                required:
                - success
                - error
                - message
                additionalProperties: false
        '404':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - false
                  error:
                    type: string
                  message:
                    type: string
                  status:
                    type: string
                required:
                - success
                - error
                - message
                additionalProperties: false
        '409':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - false
                  error:
                    type: string
                  message:
                    type: string
                  status:
                    type: string
                required:
                - success
                - error
                - message
                additionalProperties: false
        '500':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - false
                  error:
                    type: string
                  message:
                    type: string
                  status:
                    type: string
                required:
                - success
                - error
                - message
                additionalProperties: false
  /api/spreadsheets/{runId}:
    get:
      summary: Get Spreadsheet Job Status
      tags:
      - Spreadsheets
      description: Check the status of a spreadsheet processing job. Returns queued, running, finalizing, completed, failed, or cancelled status.
      parameters:
      - schema:
          type: string
        in: path
        name: runId
        required: true
        description: Unique run identifier
      security:
      - apiKey: []
      - shortcutSession: []
      - shortcutCookie: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                anyOf:
                - type: object
                  properties:
                    runId:
                      type: string
                      description: Unique run identifier
                    status:
                      type: string
                      description: Job completed successfully
                      enum:
                      - completed
                    downloadUrl:
                      type: string
                      description: URL to download the result workbook, present when the completed job produced a workbook. Ask-mode jobs may complete with only a summary.
                    summary:
                      type: string
                      description: Final AI message summary from the agent
                    artifacts:
                      type: array
                      items:
                        type: string
                      description: Filenames of files produced by the job. Download via GET /api/spreadsheets/:runId/artifacts/:filename
                  required:
                  - runId
                  - status
                  - artifacts
                  additionalProperties: false
                - type: object
                  properties:
                    runId:
                      type: string
                      description: Unique run identifier
                    status:
                      type: string
                      enum:
                      - queued
                      - running
                      - finalizing
                      description: Job is still active
                    artifacts:
                      type: array
                      items:
                        type: string
                      description: Filenames of currently available run artifacts, including live debug snapshots when debug mode is enabled.
                  required:
                  - runId
                  - status
                  additionalProperties: false
                - type: object
                  properties:
                    runId:
                      type: string
                      description: Unique run identifier
                    status:
                      type: string
                      enum:
                      - failed
                      - cancelled
                      description: Job failed or was cancelled
                    error:
                      type: string
                      description: Error message
                    downloadUrl:
                      type: string
                      description: URL to download a partial result workbook when a timeout saved one.
                    artifacts:
                      type: array
                      items:
                        type: string
                      description: Filenames of currently available run artifacts, including failure debug artifacts when debug mode is enabled.
                  required:
                  - runId
                  - status
                  - error
                  additionalProperties: false
        '401':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - false
                  error:
                    type: string
                  message:
                    type: string
                required:
                - success
                - error
                - message
                additionalProperties: false
        '403':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - false
                  error:
                    type: string
                  message:
                    type: string
                required:
                - success
                - error
                - message
                additionalProperties: false
        '404':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - false
                  error:
                    type: string
                  message:
                    type: string
                required:
                - success
                - error
                - message
                additionalProperties: false
        '500':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - false
                  error:
                    type: string
                  message:
                    type: string
                required:
                - success
                - error
                - message
                additionalProperties: false
  /api/spreadsheets/{runId}/download:
    get:
      summary: Download Spreadsheet Result
      tags:
      - Spreadsheets
      description: Download the processed Excel file for a completed workbook-producing job
      parameters:
      - schema:
          type: string
        in: path
        name: runId
        required: true
        description: Unique run identifier
      security:
      - apiKey: []
      - shortcutSession: []
      - shortcutCookie: []
      responses:
        '200':
          description: Binary Excel file
          content:
            application/json:
              schema:
                description: Binary Excel file
                type: string
                format: binary
                contentMediaType: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
        '401':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - false
                  error:
                    type: string
                  message:
                    type: string
                required:
                - success
                - error
                - message
