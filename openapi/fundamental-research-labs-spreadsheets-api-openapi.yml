openapi: 3.2.0
info:
  title: Shortcut Spreadsheets API
  version: 1.0.0
  description: 'Shortcut API lets teams automate spreadsheet workflows and export organization usage data programmatically.


    ## Getting Started


    ### Create an API key


    1. Go to shortcut.ai

    2. Navigate to **Settings → API Keys**

    3. Create a new API key


    External callers use an API key in the `Authorization` header as a Bearer token:

    `Authorization: Bearer sc-xxx`


    Authenticated Shortcut applications can call spreadsheet automation routes with

    the user''s Shortcut session or access token for run, upload, status, download,

    skills, and cancel operations. Non-browser applications send the JWT as a

    bearer token; Shortcut web applications may use the same JWT through the

    `shortcut_access_token` cookie in a credentialed request from a trusted

    Shortcut origin. `/verify` and webhooks require API key authentication because

    they depend on API key and webhook-secret state.


    Registered integrations can also use authorization-code OAuth with S256 PKCE

    and client authentication. The user approves `api:access`; the integration

    sends its OAuth access token as a Bearer token on spreadsheet routes. This

    preserves the user''s ownership, subscription, and credit checks. OAuth does not

    support API-key verification, webhooks, or organization usage export.


    ### Spreadsheet automation workflow


    1. **Verify your API key**: `GET /api/spreadsheets/verify`

    2. **Submit a job**: `POST /api/spreadsheets` with a prompt

    3. **Check status**: `GET /api/spreadsheets/:runId` (poll until completed, failed, or error)

    4. **Download result**: `GET /api/spreadsheets/:runId/download`


    ### Usage export workflow


    1. Open **Usage Metrics** in Shortcut.

    2. Copy the prefilled command from **Programmatic export**.

    3. Use the Usage API reference to customize date range, format, or grouping.


    ### Spreadsheet automation limits


    - Maximum 2000 concurrent jobs per API key

    - Job timeout: 30 minutes (configurable up to 120 minutes)'
tags:
- name: Spreadsheets
  description: Spreadsheet processing and automation endpoints
paths:
  /api/spreadsheets:
    post:
      summary: Submit Spreadsheet Processing Job
      tags:
      - Spreadsheets
      description: Submit a natural language prompt to process a spreadsheet. Optionally provide an initial Excel file and context files.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                prompt:
                  type: string
                  description: Natural language task description
                initFile:
                  type: string
                  format: uuid
                  description: Optional File ID for initial Excel file
                workbook:
                  type: object
                  properties:
                    workspacePath:
                      type: string
                      description: Path of an .xlsx/.xlsm workbook in your global workspace, relative to the workspace root (for example "models/Acme DCF.xlsx").
                  required:
                  - workspacePath
                  additionalProperties: false
                  description: Read the input workbook from your workspace instead of uploading it. Mutually exclusive with initFile. The run reads the file as of dispatch and records its storage generation as the baseline for `apply`.
                apply:
                  type: string
                  enum:
                  - review
                  - auto
                  - none
                  description: What to do with the result of a `workbook` run. "none" (default) only makes the result downloadable. "review" stores the baseline, result and a manifest in the review folder so the changes can be reviewed and merged. "auto" overwrites the workspace workbook if it is unchanged since the baseline; otherwise it falls back to "review" and reports a warning in `apply.warnings`.
                reviewPath:
                  type: string
                  description: Workspace-relative folder for review artifacts (baseline.xlsx, result.xlsx, review.json). Defaults to "platform-api/runs/<runId>". Only meaningful with apply "review" or "auto".
                automationRunId:
                  type: string
                  format: uuid
                  description: Attribute this run to an automation run, so history and credits roll up to it.
                sourceWorkspace:
                  anyOf:
                  - type: object
                    properties:
                      type:
                        type: string
                        enum:
                        - global
                      id:
                        type: string
                        enum:
                        - global
                    required:
                    - type
                    additionalProperties: false
                  - type: object
                    properties:
                      type:
                        type: string
                        enum:
                        - file
                      id:
                        type: string
                        format: uuid
                    required:
                    - type
                    - id
                    additionalProperties: false
                contextFiles:
                  type: array
                  items:
                    type: string
                    format: uuid
                  maxItems: 20
                  description: 'Optional context file IDs: at most one .xls/.xlsx context workbook, in addition to an optional initial workbook. All attachment filenames must be unique, ignoring case.'
                timeoutSeconds:
                  type: integer
                  exclusiveMinimum: 0
                  maximum: 7200
                  description: 'Optional timeout in seconds (default: 1800s, max: 7200s)'
                webhookUrl:
                  type: string
                  format: uri
                  description: 'Optional URL to receive a POST callback when the job completes or fails. Requests are signed with your API key''s webhook secret (see /verify) via X-Shortcut-Signature: sha256=<hmac-sha256>.'
                mode:
                  type: string
                  enum:
                  - action
                  - ask
                  default: action
                  description: 'Agent mode: "action" (default) reads and writes the spreadsheet, "ask" performs read-only analysis and review without modifying the spreadsheet'
                model:
                  type: string
                  minLength: 1
                  description: Optional ShortcutXL model id or model pattern for this job. Use `GET /api/spreadsheets/models` for the standard catalog and actual submission default.
                speed:
                  type: string
                  enum:
                  - standard
                  - fast
                  - ultrafast
                  description: Response speed; Fast and Ultrafast require an exact supported Shortcut model ID and Fast mode access. Ultrafast requires GPT-6 Astra and uses more credits
                thinking:
                  type: string
                  enum:
                  - 'off'
                  - minimal
                  - low
                  - medium
                  - high
                  - xhigh
                  - max
                  description: Optional ShortcutXL thinking/effort level for this job
                runtimeModelOverlay:
                  type: object
                  additionalProperties: {}
                  description: Versioned ShortcutXL runtime model overlay, carried opaquely to the runtime
                preferCurrentModelForSubagents:
                  type: boolean
                subagentModel:
                  type: string
                  minLength: 1
                projectId:
                  type: string
                  format: uuid
                  description: Optional Project ID whose source files are mounted read-only at /project. The writable /workspace mount remains the run-scoped file workspace.
                skills:
                  type: array
                  items:
                    type: string
                    minLength: 1
                  maxItems: 10
                  description: Optional source-qualified skill IDs to apply to this job. Use `GET /api/spreadsheets/skills` and submit returned `id` values such as `default:commit`, `personal:my-skill`, or `team:{teamId}:team-skill`. Submit-time validation checks id shape and team authorization, but does not perform a GCS existence check. Passing one skill is recommended — combining multiple skills may produce unpredictable results.
                retainConversation:
                  type: boolean
                  description: 'Optional. Save this run''s agent conversation as one of your Shortcut conversations so it can be reopened from chat history. When the run completes, its status includes `conversation`: an `available` locator or `unavailable`. Omitted runs keep the default unsaved session.'
                debug:
                  anyOf:
                  - type: boolean
                  - type: object
                    properties:
                      enabled:
                        type: boolean
                      snapshotIntervalMs:
                        type: integer
                        minimum: 10000
                        maximum: 60000
                    additionalProperties: false
                  description: Optional debug mode. When enabled, API-v1 periodically persists bounded runner/session debug snapshots while the sandbox run is still active.
              required:
              - prompt
              additionalProperties: false
      security:
      - apiKey: []
      - shortcutSession: []
      - shortcutCookie: []
      - shortcutOAuth: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  runId:
                    type: string
                    description: Unique run identifier
                  status:
                    type: string
                    enum:
                    - queued
                    - running
                    - finalizing
                    - completed
                    - failed
                    - cancelled
                    description: 'Job status: "queued" or "running" for a new run; the current status when an Idempotency-Key replays an existing run'
                  automationRunId:
                    type: string
                    format: uuid
                    description: The automation run this run is attributed to, when one was supplied
                  idempotentReplay:
                    type: boolean
                    description: 'Present when the Idempotency-Key matched an existing run: no new run was created and nothing was charged. The response also carries an Idempotent-Replayed: true header.'
                    enum:
                    - true
                  idempotencyWarning:
                    type: string
                    description: Present on a replay when the request body differs from the one that created the run. The original run is still returned.
                required:
                - runId
                - status
                additionalProperties: false
        '400':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  success:
                    type: boolean
                    enum:
                    - false
                  error:
                    type: string
                  message:
                    type: string
                required:
                - success
                - error
                - message
                additionalProperties: false
        '401':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - false
                  error:
                    type: string
                  message:
                    type: string
                required:
                - success
                - error
                - message
                additionalProperties: false
        '402':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - false
                  error:
                    type: string
                  message:
                    type: string
                  code:
                    type: string
                    description: AUTOMATION_BUDGET_CALLS or AUTOMATION_BUDGET_CREDITS when an automation run token reached its run or daily budget
                required:
                - success
                - error
                - message
                additionalProperties: false
        '413':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  success:
                    type: boolean
                    enum:
                    - false
                  error:
                    type: string
                  message:
                    type: string
                required:
                - success
                - error
                - message
                additionalProperties: false
        '429':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - false
                  error:
                    type: string
                  message:
                    type: string
                required:
                - success
                - error
                - message
                additionalProperties: false
        '500':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - false
                  error:
                    type: string
                  message:
                    type: string
                required:
                - success
                - error
                - message
                additionalProperties: false
      operationId: postApiSpreadsheets
      x-operation-id-source: derived
    get:
      summary: List Spreadsheet Runs
      tags:
      - Spreadsheets
      description: List past spreadsheet processing runs for the authenticated user.
      parameters:
      - schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
        in: query
        name: limit
        required: false
      - schema:
          type: integer
          minimum: 0
          default: 0
        in: query
        name: offset
        required: false
      security:
      - apiKey: []
      - shortcutSession: []
      - shortcutCookie: []
      - shortcutOAuth: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  runs:
                    type: array
                    items:
                      type: object
                      properties:
                        runId:
                          type: string
                        status:
                          type: string
                        prompt:
                          type: string
                        createdAt:
                          type: string
                        completedAt:
                          type:
                          - 'null'
                          - string
                        creditsUsed:
                          type:
                          - 'null'
                          - number
                        usage:
                          type: object
                          properties:
                            status:
                              type: string
                              enum:
                              - pending
                              - provisional
                              - unavailable
                              description: Provisional when credits have been recorded; otherwise pending for active runs or unavailable for terminal runs. Execution completion never establishes usage completeness.
                            recordedCredits:
                              anyOf:
                              - type: integer
                                minimum: -2147483648
                                maximum: 2147483647
                              - type: 'null'
                              description: The stored platform run credit snapshot, including a recorded zero. Not net of refunds.
                            asOf:
                              type: string
                              format: date-time
                              description: UTC response observation time for the stored row, not an event watermark, last usage update or completeness guarantee.
                            coverage:
                              type: string
                              enum:
                              - stored_run_snapshot
                            revision:
                              type: 'null'
                              description: No canonical usage reconciliation revision is available yet.
                          required:
                          - status
                          - recordedCredits
                          - asOf
                          - coverage
                          - revision
                          additionalProperties: false
                        summary:
                          type:
                          - 'null'
                          - string
                        automationRunId:
                          type:
                          - 'null'
                          - string
                      required:
                      - runId
                      - status
                      - prompt
                      - createdAt
                      - completedAt
                      - creditsUsed
                      - usage
                      - summary
                      - automationRunId
                      additionalProperties: false
                  limit:
                    type: number
                  offset:
                    type: number
                required:
                - runs
                - limit
                - offset
                additionalProperties: false
        '401':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - false
                  error:
                    type: string
                  message:
                    type: string
                required:
                - success
                - error
                - message
                additionalProperties: false
      operationId: getApiSpreadsheets
      x-operation-id-source: derived
  /api/spreadsheets/models:
    get:
      summary: List Models
      tags:
      - Spreadsheets
      description: 'List the curated standard, ungated model catalog and the actual spreadsheet submission default. This is not every accepted runtime model: administrator-added, gated, experimental, and custom models are excluded for all callers. Product picker preferences (including APAC and organization defaults) do not change this Platform API catalog or submission default. Pass a returned `id` as `model` in `POST /api/spreadsheets`. Supported thinking levels are not included; the submit schema documents accepted thinking values.'
      security:
      - apiKey: []
      - shortcutSession: []
      - shortcutCookie: []
      - shortcutOAuth: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  models:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: Model reference — pass this exact value as `model` when submitting a job to `POST /api/spreadsheets`.
                        name:
                          type: string
                          description: Human-readable model name
                        description:
                          type: string
                          description: What the model is best suited for
                        default:
                          type: boolean
                          description: Whether jobs use this model when `model` is omitted
                      required:
                      - id
                      - name
                      - description
                      - default
                      additionalProperties: false
                required:
                - models
                additionalProperties: false
        '401':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - false
                  error:
                    type: string
                  message:
                    type: string
                required:
                - success
                - error
                - message
                additionalProperties: false
        '423':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - false
                  error:
                    type: string
                  message:
                    type: string
                required:
                - success
                - error
                - message
                additionalProperties: false
        '500':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - false
                  error:
                    type: string
                  message:
                    type: string
                required:
                - success
                - error
                - message
                additionalProperties: false
        '503':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - false
                  error:
                    type: string
                  message:
                    type: string
                required:
                - success
                - error
                - message
                additionalProperties: false
      operationId: getApiSpreadsheetsModels
      x-operation-id-source: derived
  /api/spreadsheets/skills:
    get:
      summary: List Skills
      tags:
      - Spreadsheets
      description: List available skills (built-in/default, personal, and team). The returned `id` is source-qualified and is the only accepted value for `POST /api/spreadsheets` `skills`; older folder-name-only ids are rejected. The web UI labels default skills as Official, but the API id prefix is `default:`.
      security:
      - apiKey: []
      - shortcutSession: []
      - shortcutCookie: []
      - shortcutOAuth: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  skills:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: Source-qualified skill identifier — pass this exact value in the `skills` array when submitting a job. Valid prefixes are `default:`, `personal:`, and `team:{teamId}:`.
                        folderName:
                          type: string
                          description: Skill folder name used for paths and slash commands
                        name:
                          type: string
                          description: Human-readable skill name
                        description:
                          type: string
                          description: When to use this skill
                        source:
                          type: string
                          enum:
                          - default
                          - user
                          - team
                          description: Where the skill comes from
                      required:
                      - id
                      - folderName
                      - name
                      - description
                      - source
                      additionalProperties: false
                required:
                - skills
                additionalProperties: false
        '401':
          description: Default Response
          content:
